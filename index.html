<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>手游墓园</title>
  <meta name="description" content="为关服的游戏立碑，让它们以单机之身重返人间">
  <meta name="theme-color" content="#07080c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 60V26a18 18 0 0 1 36 0v34Z' fill='%23706e78'/%3E%3Cpath d='M29 18h6v24h-6zM22 25h20v6H22z' fill='%23222'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&family=UnifrakturMaguntia&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/grave.css">
  <link rel="stylesheet" href="css/crypt.css">
</head>
<body class="is-loading">
  <!-- 全局 SVG 定义 -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="bv" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
        <stop offset=".45" stop-color="#fff" stop-opacity=".05"/>
        <stop offset=".6" stop-color="#000" stop-opacity=".2"/>
        <stop offset="1" stop-color="#000" stop-opacity=".7"/>
      </linearGradient>
      <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2a2d36"/>
        <stop offset=".35" stop-color="#101117"/>
        <stop offset="1" stop-color="#050507"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- 天幕：月亮、云、星空 -->
  <div class="sky" aria-hidden="true">
    <canvas id="sky-canvas"></canvas>
    <canvas id="sky-fx"></canvas>
    <div class="moon-wrap">
      <div class="moon-halo"></div>
      <div class="moon"></div>
    </div>
    <div class="clouds"><div class="cloud-band c1"></div><div class="cloud-band c2"></div></div>
  </div>
  <div class="flash" aria-hidden="true"></div>

  <main id="scene">
    <header class="hero" id="top">
      <div class="landscape" aria-hidden="true">
        <div class="layer far" data-depth="0.12"></div>
        <div class="layer mid" data-depth="0.28"></div>
        <div class="layer near" data-depth="0.45"></div>
      </div>
      <div class="bats" aria-hidden="true"></div>

      <div class="hero-content">
        <div class="hero-ornament" aria-hidden="true"></div>
        <p class="hero-latin" data-text="site.titleLatin"></p>
        <h1 class="hero-title" data-text="site.title"></h1>
        <p class="hero-sub" data-text="site.subtitle"></p>
        <p class="hero-epi" data-text="site.epigraph"></p>
        <p class="hero-stats"></p>
      </div>
      <a class="descend" href="#yard">
        <span data-text="labels.scrollHint"></span>
        <i aria-hidden="true"></i>
      </a>
    </header>

    <section class="yard" id="yard">
      <div class="yard-section" id="section-buried">
        <h2 class="yard-title">
          <span class="yard-title-latin">Requiescant in Pace</span>
          <span class="yard-title-main" data-text="labels.buried"></span>
        </h2>
        <div class="graves" id="graves-buried"></div>
      </div>

      <div class="yard-section" id="section-open">
        <h2 class="yard-title">
          <span class="yard-title-latin">Nondum Sepulti</span>
          <span class="yard-title-main" data-text="labels.open"></span>
        </h2>
        <div class="graves" id="graves-open"></div>
      </div>

      <div class="yard-section" id="section-alive">
        <h2 class="yard-title">
          <span class="yard-title-latin">Lumina Perpetua</span>
          <span class="yard-title-main" data-text="labels.alive"></span>
        </h2>
        <p class="yard-note" data-text="labels.aliveNote"></p>
        <div class="graves lamps" id="graves-alive"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="fence" aria-hidden="true"></div>
      <p class="footer-text" data-text="site.footer"></p>
      <nav class="footer-links"></nav>
    </footer>
  </main>

  <!-- 前景氛围层 -->
  <div class="fog-front" aria-hidden="true"><div class="fog-band f1"></div><div class="fog-band f2"></div></div>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <canvas class="lantern-light" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- 放大后的墓碑 / 羊皮卷 -->
  <div id="crypt" class="crypt" hidden role="dialog" aria-modal="true" aria-label="墓碑">
    <div class="crypt-veil"></div>
    <div class="crypt-stage"></div>
  </div>

  <!-- 开场铁门 -->
  <div id="gate" class="gate" hidden>
    <div class="gate-backlight"></div>
    <div class="gate-door left"></div>
    <div class="gate-door right"></div>
    <div class="gate-lock" aria-hidden="true"></div>
    <div class="gate-plaque">
      <p class="gate-latin" data-text="site.titleLatin"></p>
      <p class="gate-title" data-text="site.title"></p>
      <button class="gate-enter" type="button"><span data-text="site.enterText"></span></button>
      <p class="gate-hint" data-text="site.enterHint"></p>
    </div>
  </div>

  <button id="audio-toggle" class="audio-toggle" type="button" hidden aria-label="背景音"></button>
  <audio id="ambient" loop preload="none"></audio>

  <script src="config.js"></script>
  <script src="js/lib.js"></script>
  <script src="js/atmosphere.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/graves.js"></script>
  <script src="js/crypt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
